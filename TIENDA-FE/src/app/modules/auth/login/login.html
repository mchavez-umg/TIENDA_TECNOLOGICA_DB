<div class="login">
  <mat-card appearance="outlined" class="tarjeta">
    <header class="encabezado">
      <mat-icon>storefront</mat-icon>
      <div>
        <h1>Tienda Tec</h1>
        <p>Sistema administrativo</p>
      </div>
    </header>

    <form class="formulario" [formGroup]="form" (ngSubmit)="ingresar()">
      <mat-form-field>
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        @if (form.controls.username.hasError('required')) {
          <mat-error>Ingrese su usuario</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.hasError('required')) {
          <mat-error>Ingrese su contraseña</mat-error>
        }
      </mat-form-field>

      @if (error()) {
        <div class="error" role="alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error() }}</span>
        </div>
      }

      <button mat-flat-button type="submit" class="ingresar" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </mat-card>
</div>
